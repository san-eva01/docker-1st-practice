server {
    listen 80;
    server_name _;

    # DNS interno de Docker: resuelve "backend" en cada petición,
    # así Nginx sigue funcionando si el contenedor del backend se reinicia y cambia de IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root  /usr/share/nginx/html;
    index index.html;

    # Archivos estáticos
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy de /api/ hacia el backend: /api/reservaciones -> http://backend/reservaciones
    location /api/ {
        set $backend_upstream http://backend:80;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
    }
}
